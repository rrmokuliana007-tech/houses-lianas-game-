<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="moonGrad" cx="38%" cy="35%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="40%" stop-color="#c0c0c0"/>
      <stop offset="70%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#303030"/>
    </radialGradient>
    <filter id="moonGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="140" fill="url(#moonGrad)" filter="url(#moonGlow)"/>
  <!-- Craters -->
  <circle cx="150" cy="160" r="18" fill="rgba(0,0,0,0.08)"/>
  <circle cx="240" cy="180" r="25" fill="rgba(0,0,0,0.06)"/>
  <circle cx="170" cy="240" r="12" fill="rgba(0,0,0,0.1)"/>
  <circle cx="220" cy="130" r="10" fill="rgba(0,0,0,0.07)"/>
  <circle cx="140" cy="200" r="8" fill="rgba(0,0,0,0.09)"/>
</svg>
