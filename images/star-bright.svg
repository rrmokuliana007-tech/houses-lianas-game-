<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffe8a0" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ffb830" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffb830" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Four-pointed star -->
  <g transform="translate(200,200)" filter="url(#glow)">
    <circle cx="0" cy="0" r="120" fill="url(#starGlow)"/>
    <polygon points="0,-80 15,-15 80,0 15,15 0,80 -15,15 -80,0 -15,-15"
      fill="#fff" opacity="0.9"/>
    <polygon points="0,-40 8,-8 40,0 8,8 0,40 -8,8 -40,0 -8,-8"
      fill="#ffe8a0"/>
  </g>
</svg>
